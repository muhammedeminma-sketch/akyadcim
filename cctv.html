<!doctype html>
<html lang="tr" class="dark">
<head>
  <meta charset="utf-8">
  <title>DCIM TT — CCTV İzleme</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/img/Turk-Telekom-Symbol.png">
  <script>try{var m=localStorage.getItem('akya_theme_mode');if(m==='light'){document.documentElement.classList.remove('dark');document.documentElement.classList.add('light');}var s=parseInt(localStorage.getItem('akya_ui_scale')||'100',10);document.documentElement.style.fontSize=([75,90,100,115,130].indexOf(s)>=0?s:100)+'%';}catch(e){document.documentElement.style.fontSize='100%';}</script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/tailwind-extra.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/cctv.css">
</head>
<body class="dark">
  <div class="h-screen flex flex-col font-sans bg-slate-100 dark:bg-surface-base text-slate-900 dark:text-slate-100 transition-colors duration-150 overflow-hidden">
    <header id="app-header" class="h-13 shrink-0 bg-white dark:bg-surface-base border-b border-slate-200 dark:border-border-subtle sticky top-0 z-40 flex items-center justify-between px-3 md:px-4 shadow-2xs select-none" data-report-hide></header>

    <main class="flex-1 min-h-0 overflow-hidden bg-slate-100 dark:bg-[#080c14] text-slate-900 dark:text-slate-100 p-2.5 sm:p-3 flex flex-col">
      <div class="h-full min-h-0 overflow-y-auto">
        <div class="mx-auto flex w-full max-w-[1680px] flex-col gap-3 pb-4">

          <!-- Page Header (app-page-header) -->
          <div class="mb-3 pb-2 flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-800/80 select-none">
            <div class="flex items-center gap-3">
              <div>
                <nav class="max-lg:hidden flex items-center gap-1 text-[10px] text-slate-500 dark:text-slate-400 mb-0.5 font-medium">
                  <a href="dashboard.html" class="hover:text-sky-600 dark:hover:text-sky-400 cursor-pointer"><i class="pi pi-home text-[10px]"></i></a>
                  <i class="pi pi-chevron-right text-[8px] text-slate-400"></i>
                  <span class="text-slate-700 dark:text-slate-300 font-bold">Operasyonlar</span>
                  <i class="pi pi-chevron-right text-[8px] text-slate-400"></i>
                  <span class="text-slate-700 dark:text-slate-300 font-bold">CCTV İzleme</span>
                </nav>
                <div class="flex items-center gap-2">
                  <h1 class="text-sm md:text-base font-extrabold tracking-tight text-slate-900 dark:text-slate-100">CCTV İzleme</h1>
                </div>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-2.5 shrink-0 ml-auto">
              <div class="flex items-center gap-2" id="cctv-actions"></div>
            </div>
          </div>

          <!-- Servis durumu -->
          <section class="flex items-start gap-3 rounded-[2px] border border-amber-500/30 border-l-[3px] border-l-amber-500 bg-amber-50 px-3 py-2.5 dark:bg-amber-500/5">
            <i class="pi pi-exclamation-triangle mt-0.5 text-sm text-amber-600 dark:text-amber-400"></i>
            <div class="min-w-0">
              <div class="text-[12px] font-black tracking-wide text-amber-800 dark:text-amber-300">CANLI GÖRÜNTÜ SERVİSİ DEVRE DIŞI</div>
              <div class="text-[11px] text-amber-900/80 dark:text-amber-200/70">
                Kamera akışları henüz devreye alınmadı. Bağlantı kurulduğunda görüntüler kanallarda canlı olarak gösterilecek.
              </div>
            </div>
          </section>

          <!-- Kanal ızgarası -->
          <div class="cctv-grid" id="cctv-grid"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/layout-data.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/mock/alarms.data.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/report-kit.js"></script>
  <script src="js/mock/cctv.data.js"></script>
  <script src="js/cctv.js"></script>
</body>
</html>
