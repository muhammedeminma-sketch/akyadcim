<!doctype html>
<html lang="tr" class="dark">
<head>
  <meta charset="utf-8">
  <title>DCIM TT — Kilit Yetkilendirme</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/img/Turk-Telekom-Symbol.png">
  <script>try{var m=localStorage.getItem('akya_theme_mode');if(m==='light'){document.documentElement.classList.remove('dark');document.documentElement.classList.add('light');}var s=parseInt(localStorage.getItem('akya_ui_scale')||'100',10);document.documentElement.style.fontSize=([75,90,100,115,130].indexOf(s)>=0?s:100)+'%';}catch(e){document.documentElement.style.fontSize='100%';}</script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/tailwind-extra.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/lock-authorization.css">
</head>
<body class="dark">
  <div class="h-screen flex flex-col font-sans bg-slate-100 dark:bg-surface-base text-slate-900 dark:text-slate-100 transition-colors duration-150 overflow-hidden">
    <header id="app-header" class="h-13 shrink-0 bg-white dark:bg-surface-base border-b border-slate-200 dark:border-border-subtle sticky top-0 z-40 flex items-center justify-between px-3 md:px-4 shadow-2xs select-none" data-report-hide></header>

    <main class="flex-1 min-h-0 overflow-hidden bg-slate-100 dark:bg-[#080c14] text-slate-900 dark:text-slate-100 p-2.5 sm:p-3 flex flex-col">
      <div class="flex-1 min-h-0 flex gap-3">

        <!-- POD / Kabin kapsam kenar çubuğu (app-sidebar) -->
        <div id="la-sidebar" class="la-sidebar-host hidden lg:flex shrink-0 min-h-0"></div>

        <div class="flex-1 min-w-0 min-h-0 overflow-y-auto custom-scrollbar">
          <div class="w-full flex flex-col gap-2 p-1 pb-6">

            <!-- Page Header (app-page-header) -->
            <div id="la-header"></div>

            <!-- Özet Kartları -->
            <div id="la-summary" class="shrink-0 grid grid-cols-2 md:grid-cols-4 gap-2"></div>

            <!-- Sekmeler + aktif kapsam -->
            <div class="shrink-0 flex flex-wrap items-center justify-between gap-2">
              <div id="la-tabs" class="flex flex-wrap items-center gap-1 bg-slate-200/70 dark:bg-slate-900/70 p-0.5 rounded-[2px] border border-slate-200 dark:border-border-subtle"></div>
              <div id="la-scope" class="flex flex-wrap items-center gap-1.5 text-[10px]"></div>
            </div>

            <!-- Sekme araç çubuğu -->
            <section id="la-toolbar" class="operator-toolbar shrink-0 flex flex-col lg:flex-row lg:items-center justify-between gap-2.5 p-2 rounded-[2px] border border-slate-200 dark:border-border-subtle bg-white dark:bg-surface-card"></section>

            <!-- Sekme içeriği -->
            <div id="la-content" class="flex flex-col"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/layout-data.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/lock-authorization.js"></script>
</body>
</html>
