<!doctype html>
<html lang="tr" class="dark">
<head>
  <meta charset="utf-8">
  <title>DCIM TT — 2D Dijital İkiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/img/Turk-Telekom-Symbol.png">
  <script>try{var m=localStorage.getItem('akya_theme_mode');if(m==='light'){document.documentElement.classList.remove('dark');document.documentElement.classList.add('light');}var s=parseInt(localStorage.getItem('akya_ui_scale')||'100',10);document.documentElement.style.fontSize=([75,90,100,115,130].indexOf(s)>=0?s:100)+'%';}catch(e){document.documentElement.style.fontSize='100%';}</script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/tailwind-extra.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="dark">
  <div class="h-screen flex flex-col font-sans bg-slate-100 dark:bg-surface-base text-slate-900 dark:text-slate-100 transition-colors duration-150 overflow-hidden">
    <header id="app-header" class="h-13 shrink-0 bg-white dark:bg-surface-base border-b border-slate-200 dark:border-border-subtle sticky top-0 z-40 flex items-center justify-between px-3 md:px-4 shadow-2xs select-none" data-report-hide></header>

    <main class="flex-1 min-h-0 overflow-hidden bg-slate-100 dark:bg-[#080c14] text-slate-900 dark:text-slate-100 p-2.5 sm:p-3 flex flex-col">
      <div class="flex flex-col h-[calc(100vh-5.25rem)] overflow-hidden gap-1.5">

        <!-- Page Header (compact) with Integrated Telemetry & Action Bar -->
        <div class="shrink-0 mb-1 pb-1 flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 dark:border-slate-800/80 select-none">
          <div class="flex items-center gap-3">
            <div>
              <nav class="flex items-center gap-1 text-[10px] text-slate-500 dark:text-slate-400 mb-0.5 font-medium">
                <a href="2d.html" class="hover:text-sky-600 dark:hover:text-sky-400 cursor-pointer"><i class="pi pi-home text-[10px]"></i></a>
                <i class="pi pi-chevron-right text-[8px] text-slate-400"></i>
                <span class="text-slate-700 dark:text-slate-300 font-bold">Operasyon</span>
                <i class="pi pi-chevron-right text-[8px] text-slate-400"></i>
                <span class="text-slate-700 dark:text-slate-300 font-bold">Dijital İkiz (2D)</span>
              </nav>
              <div class="flex items-center gap-2">
                <h1 class="text-sm md:text-base font-extrabold tracking-tight text-slate-900 dark:text-slate-100">2D Dijital İkiz</h1>
              </div>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-2.5 shrink-0 ml-auto">
            <div class="flex flex-wrap items-center gap-2" id="header-slot"></div>
          </div>
        </div>

        <!-- Digital Twin Layout -->
        <div class="flex flex-1 gap-2.5 min-h-0 overflow-hidden">
          <!-- 1. Left Location & Layers Panel -->
          <div id="left-panel" data-report-hide class="w-72 shrink-0 bg-white/95 dark:bg-[#0b1320]/95 border border-slate-200 dark:border-border-subtle rounded-[2px] p-2.5 flex flex-col justify-between shadow-xs transition-all duration-300 overflow-y-auto custom-scrollbar"></div>

          <!-- 2. Center Canvas -->
          <div class="flex-1 flex flex-col min-w-0 h-full">
            <div id="canvas-wrap" class="relative flex-1 w-full h-full bg-white dark:bg-surface-base border border-slate-200 dark:border-border-subtle rounded-[2px] overflow-hidden shadow-2xs flex flex-col">
              <button id="open-left-panel" type="button" data-report-hide title="Sol paneli aç" class="hidden absolute top-2.5 left-2.5 z-20 px-2.5 py-1 bg-white/95 dark:bg-[#0b1320]/95 border border-slate-200 dark:border-border-subtle rounded-[2px] shadow-sm flex items-center gap-1.5 text-xs font-bold text-slate-800 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all cursor-pointer backdrop-blur-sm pointer-events-auto">
                <i class="pi pi-bars text-xs text-sky-600 dark:text-sky-400"></i>
                <span>1. Kat 1. Salon Sistem Odası</span>
              </button>

              <!-- Canlı durum lejantı -->
              <div class="absolute bottom-2.5 right-2.5 z-20 hidden md:flex items-center gap-3 px-3 py-1.5 rounded-[2px] bg-white/95 dark:bg-slate-950/90 border border-slate-200 dark:border-slate-700/80 text-[10px] text-slate-700 dark:text-slate-300 shadow-md backdrop-blur-xs pointer-events-none" id="legend"></div>

              <div class="w-full h-full" id="schematic-host"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Kabin İzometrik & Sensör Çekmecesi -->
  <div id="drawer-backdrop" class="dcim-drawer-backdrop fixed inset-0 z-40 bg-slate-950/45 dark:bg-slate-950/65 backdrop-blur-[2px]"></div>
  <aside id="cabinet-drawer" class="dcim-drawer-panel fixed top-0 right-0 bottom-0 z-50 w-full bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col select-none" style="width: min(84vw, 1620px); min-width: min(100vw, 560px); max-width: 100vw;"></aside>

  <script src="js/layout-data.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/ui-components.js"></script>
  <script src="js/2d.js"></script>
</body>
</html>
