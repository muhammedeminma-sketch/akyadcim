<!doctype html>
<html lang="tr" class="dark">
<head>
  <meta charset="utf-8">
  <title>DCIM TT — PDU Detay Sayfası</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/img/Turk-Telekom-Symbol.png">
  <script>try{var m=localStorage.getItem('akya_theme_mode');if(m==='light'){document.documentElement.classList.remove('dark');document.documentElement.classList.add('light');}var s=parseInt(localStorage.getItem('akya_ui_scale')||'100',10);document.documentElement.style.fontSize=([75,90,100,115,130].indexOf(s)>=0?s:100)+'%';}catch(e){document.documentElement.style.fontSize='100%';}</script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/tailwind-extra.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pdu-detail.css">
</head>
<body class="dark">
  <div class="h-screen flex flex-col font-sans bg-slate-100 dark:bg-surface-base text-slate-900 dark:text-slate-100 transition-colors duration-150 overflow-hidden">
    <header id="app-header" class="h-13 shrink-0 bg-white dark:bg-surface-base border-b border-slate-200 dark:border-border-subtle sticky top-0 z-40 flex items-center justify-between px-3 md:px-4 shadow-2xs select-none" data-report-hide></header>

    <main class="flex-1 min-h-0 overflow-hidden bg-slate-100 dark:bg-[#080c14] text-slate-900 dark:text-slate-100 p-2.5 sm:p-3 flex flex-col">
      <!-- pdu-detail.component.html -->
      <div class="flex flex-col h-[calc(100vh-5.5rem)] overflow-hidden space-y-2 font-sans">
        <!-- Page Header (app-page-header) -->
        <div class="shrink-0" id="page-header"></div>

        <!-- Sol: Lokasyon ağacı + Sağ: PDU detay alanı -->
        <div class="flex flex-col lg:flex-row flex-1 gap-2.5 min-h-0 overflow-y-auto lg:overflow-hidden">
          <!-- LOKASYON & KABİNLER -->
          <div data-report-hide class="w-full lg:w-72 shrink-0 bg-white dark:bg-surface-card border border-slate-200 dark:border-border-subtle rounded-[2px] p-2.5 flex flex-col justify-between shadow-xs overflow-hidden h-64 lg:h-full">
            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-1.5 shrink-0">
              <h3 class="text-xs font-extrabold text-slate-900 dark:text-slate-100 flex items-center gap-1.5 truncate">
                <i class="pi pi-sitemap text-sky-600 dark:text-sky-400 text-xs shrink-0"></i>
                <span class="truncate">Lokasyon &amp; Kabinler</span>
              </h3>
              <span id="pdu-tree-badge"></span>
            </div>
            <!-- app-location-tree -->
            <div class="space-y-1 flex-1 min-h-0 overflow-y-auto pr-0.5 pt-1.5" id="pdu-tree"></div>
          </div>

          <!-- MAIN CONTENT AREA -->
          <div class="flex-1 min-w-0 bg-transparent flex flex-col min-h-0 overflow-y-auto pr-1 space-y-2.5" id="pdu-main"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/layout-data.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/pdu-detail.js"></script>
</body>
</html>
